name: build-sign-notarize

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: true
        default: "0.1.0"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: Import signing cert
        if: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 != '' && secrets.MACOS_INSTALLER_CERT_PASSWORD != '' }}
        env:
          CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/productsign -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build pkg
        env:
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        run: |
          chmod +x deploy/build-pkg.sh deploy/notarize-pkg.sh deploy/pkg-scripts/preinstall deploy/pkg-scripts/postinstall
          ./deploy/build-pkg.sh "${{ github.event.inputs.version }}"

      - name: Setup notary profile
        if: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_APP_PASSWORD != '' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials quickelevate-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD"

      - name: Notarize pkg
        if: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_APP_PASSWORD != '' && secrets.DEVELOPER_ID_INSTALLER != '' }}
        env:
          NOTARY_PROFILE: quickelevate-notary
        run: |
          ./deploy/notarize-pkg.sh "dist/QuickElevate-${{ github.event.inputs.version }}.pkg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickelevate-pkg
          path: dist/*
